server:
  port: 8080


spring:
  config:
    import: common.yml, datasource/datasource-local.yml

  # H2 Console
  h2:
    console:
      enabled: true           # H2 Console
      path: /h2-console/       # H2 Console

      settings:
        web-allow-others: true

  # JPA
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create        # DB (none, create, create-drop, update, validate)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show-sql: true
        default_batch_fetch_size: 1000
    defer-datasource-initialization: true

  batch:
    jdbc:
      initialize-schema: always

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      useSsl: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

multipart:
  max-upload-size: 500KB

file:
  upload-dir: ${user.dir}/src/main/resources/images/

ec2:
  host: localhost
  port: 8080

oauth:
  aos:
    google:
      client-id: 407408718192.apps.googleusercontent.com
  ios:
    google:
      client-id: 407408718192.apps.googleusercontent.com
    apple:
      client-id: com.ilsang240615.dev
